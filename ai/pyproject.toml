[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "capstone-ai"
version = "0.1.0"
requires-python = ">=3.10,<3.11"
dependencies = ["numpy==1.26.4", "jsonschema==4.23.0", "pyulog==1.1.0", "PyYAML==6.0.2", "safetensors==0.4.5"]
[project.optional-dependencies]
live = ["pymavlink==2.4.50"]
[project.scripts]
capstone-ai = "capstone_ai.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.ruff]
target-version = "py310"
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["pretrain"]
