revision: vtc6-4s4p-cmu-vah01-v1
scope: X500_reference_VTC6_4S4P_collection_only
basis: CMU VAH01 initial snapshot defines normal physical health; no hardware certification
cmu_battery_model:
  revision: cmu-vah01-baseline/1
  catalog: profiles/battery-aging/cmu-vah01.json
  normal: rpt_00
  aged: rpt_16
  flight_policy: cmu-vah01-rpt16-only/1
  cell_scope: VAH01 only
  all_motor_scenarios: same model; optional fixed rpt_16
  transition: linear R0/R1/C1/Q/OCV; continuous SOC and Vp with signed charge/energy
    ledger
normal_health:
  motor_resistance_multiplier:
  - 1.0
  - 1.0
  manufacturing_randomization: disabled_no_measured_population_distribution
normal_operation:
  initial_soc:
  - 0.4
  - 0.9
  ambient_temperature_k:
  - 283.15
  - 298.15
  central_payload_kg:
  - 0.0
  - 0.2
  mission:
  - hover
  - altitude
  - horizontal
  - yaw
  - waypoint
  min_true_soc: 0.2
  min_pack_voltage_v: 12.4
  max_esc_command_during_mission: 0.9
  instantaneous_total_wind_mps:
  - 0.0
  - 5.0
  bounded_variation_dimensionless:
  - 0.5
  - 1.5
anomaly_levels:
  battery: measured VAH01 rpt_16 only
  motor: profiles/propulsion-health.json; normal or abnormal joint profile only
limits:
- values are engineering experiments, not measured detection limits or lifetime severity
  curves
- independent resets at same initial SOC are not same initial remaining Ah when Q
  differs
- no same_asset_future continuity is claimed
- Collection records are not exchangeable with 4S2P or prior test runs
- 15min normal /5min lowSOC/8min anomaly are planned durations; completion and envelope
  checked after actual flight
capacity_basis: manufacturer minimum 3.0Ah/cell at datasheet test conditions; conservative
  engineering choice, not 12Ah flight-tested
assessment:
  common19_max_source_gap_s: 0.5
  normal_gate: model envelope, voltage>=12.4V, trueSOC>=0.2, ESC command<=0.9
  anomaly_gate: finite physical/solver state; normal endurance limits reported separately,
    not automatic exclusion
  scope: post-run simulation eligibility, not hardware damage certification or detector
    performance
propulsion_health:
  revision: x500-propulsion-binary-v1
  normal: normal
  abnormal: abnormal
  scenarios:
  - propulsion_loss_existing
  - propulsion_loss_step
  - propulsion_loss_ramp
  transition: simultaneous linear Rm,b,kF,kQ; step1s/ramp20s
wind_support:
  revision: bounded-latent-ou-c2-enu-v1
  physical_quantity: magnitude of instantaneous3D air-mass velocity in ENU
  environments:
    calm:
    - 0.0
    - 0.0
    low:
      bin: 0<speed<=2.5
      generator:
      - 0.25
      - 2.25
    strong:
      bin: 2.5<speed<=5
      generator:
      - 2.75
      - 4.75
  latent_knot_std_dimensionless: 1.0
  latent_tau_s: 2.0
  latent_knot_period_s: 1.0
  interpolation: quintic C2 in latent coordinates
  legacy_gaussian_ou: original formula and m/s sigma semantics preserved for reference;
    not current bounded admission
  planned_airspeed_max_mps: 7.0
  model_airspeed_max_mps: 8.0
  max_inplane_advance_ratio: 0.1
  qualification: unit/numeric/SITL only; no hardware or measured wind spectrum certification
