# CPU-only data environment; native and AI training environments remain separate.
[tool.ruff]
target-version = "py312"
line-length = 80
extend-exclude = ["**/resources/**", "tools/collection_support.py"]
force-exclude = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "PLW1510"]

[tool.pytest.ini_options]
markers = [
  "local_evidence: requires preserved local campaign records, AI environment, or installed native simulator (excluded only by explicit -m selection)",
]
